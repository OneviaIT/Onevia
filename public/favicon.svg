<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ov1Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="ov1Shine" maskUnits="userSpaceOnUse" style="mask-type:alpha">
      <image xlink:href="/brand/onevia-ov1.png" x="10" y="22" width="80" height="56" preserveAspectRatio="xMidYMid meet" />
    </mask>
  </defs>
  <rect width="100" height="100" fill="#000000" rx="20" />
  <image xlink:href="/brand/onevia-ov1.png" x="10" y="22" width="80" height="56" preserveAspectRatio="xMidYMid meet" />
  <g mask="url(#ov1Shine)">
    <rect x="-40" y="0" width="22" height="100" fill="url(#ov1Grad)" transform="skewX(-18)">
      <animate attributeName="x" from="-40" to="120" dur="2.4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
