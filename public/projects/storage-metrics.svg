<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Browser extension comparing storage usage across modules">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#07070a"/></linearGradient></defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect x="60" y="40" width="520" height="280" rx="16" fill="#111114" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
  <rect x="60" y="40" width="520" height="36" rx="16" fill="#1c1c21"/>
  <circle cx="86" cy="58" r="6" fill="#ef4444"/><circle cx="106" cy="58" r="6" fill="#eab308"/><circle cx="126" cy="58" r="6" fill="#22c55e"/>
  <rect x="160" y="48" width="300" height="20" rx="10" fill="#0a0a0a"/>
  <g transform="translate(528 46)"><rect width="40" height="24" rx="6" fill="#ef233c"/><path d="M10 16V8m6 8V5m6 11v-6m6 6v-9" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
  <g font-family="monospace" font-size="13" fill="#a1a1aa">
    <text x="90" y="120">localStorage</text><rect x="210" y="108" width="300" height="16" rx="8" fill="#27272a"/><rect x="210" y="108" width="210" height="16" rx="8" fill="#ef233c"/><text x="520" y="121">2.1 MB</text>
    <text x="90" y="160">sessionStorage</text><rect x="210" y="148" width="300" height="16" rx="8" fill="#27272a"/><rect x="210" y="148" width="90" height="16" rx="8" fill="#60a5fa"/><text x="520" y="161">0.9 MB</text>
    <text x="90" y="200">IndexedDB</text><rect x="210" y="188" width="300" height="16" rx="8" fill="#27272a"/><rect x="210" y="188" width="260" height="16" rx="8" fill="#a855f7"/><text x="520" y="201">3.4 MB</text>
    <text x="90" y="240">Cookies</text><rect x="210" y="228" width="300" height="16" rx="8" fill="#27272a"/><rect x="210" y="228" width="30" height="16" rx="8" fill="#22c55e"/><text x="520" y="241">0.1 MB</text>
  </g>
  <g transform="translate(90 268)" font-family="monospace" font-size="12" fill="#fff" fill-opacity=".7">
    <rect width="150" height="34" rx="8" fill="#1c1c21"/><text x="12" y="22">Module: Checkout</text>
    <rect x="165" width="150" height="34" rx="8" fill="#1c1c21"/><text x="177" y="22">Module: Reports</text>
    <rect x="330" width="150" height="34" rx="8" fill="#ef233c" fill-opacity=".2" stroke="#ef233c"/><text x="342" y="22">Δ +1.3 MB</text>
  </g>
</svg>
